    <h2>Preguntas frecuentes</h2>
    <dl>
      <dt><strong>¿Qerub solo hace ciberseguridad o también IA, datos y software?</strong></dt>
      <dd>Las cuatro cosas, con un mismo equipo senior y precio cerrado. La ciberseguridad (Q-Secure) es el pilar más maduro; IA y datos (Q-Intelligence) y software a medida (Q-Build) se entregan con alcance acotado, precio cerrado y total transparencia. Y Q-Pod aporta equipos senior integrados (staff augmentation).</dd>
      <dt><strong>¿Cómo funciona el modelo de equipos senior (Q-Pod)?</strong></dt>
      <dd>Presentamos una terna senior en 5-10 días, con CV, años y stack. La persona se integra en tu equipo y trabaja en tu huso horario. Pagas resultado, no sillas, y si en dos semanas no encaja, se cambia sin coste. Sin junior facturados.</dd>
      <dt><strong>¿Tenéis oficinas en tres países?</strong></dt>
      <dd>Operamos en tres husos horarios: España (cumplimiento europeo), Argentina (entrega senior nearshore) y Estados Unidos (frente comercial). Te decimos exactamente qué hay en cada sitio, sin vender una gran firma que no somos.</dd>
      <dt><strong>¿Cuánto cuesta una auditoría de ciberseguridad para una pyme?</strong></dt>
      <dd>El diagnóstico Q-Start tiene precio cerrado según el tamaño de la organización, desde 1.250 €. Enviamos una propuesta concreta en 24 horas tras la primera llamada.</dd>
      <dt><strong>¿Necesitamos equipo técnico interno para trabajar con Qerub?</strong></dt>
      <dd>No. El diagnóstico está diseñado para que la dirección entienda y decida sin un CISO interno. Si hay proveedor IT, coordinamos con él.</dd>
      <dt><strong>¿Qerub trabaja con NIS2?</strong></dt>
      <dd>Sí. Q-Continuity genera evidencias trazables de gobierno, gestión de incidentes y continuidad — los pilares de NIS2.</dd>
      <dt><strong>¿Hacéis pentesting?</strong></dt>
      <dd>No como puerta de entrada. Lo introducimos cuando la postura base ya está sana; antes, un pentest solo confirma lo que ya sabemos.</dd>
    </dl>
