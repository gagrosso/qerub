    <h1>Qerub — Consultoría IT para empresas en crecimiento</h1>
    <p>Tu equipo de IT senior, con precio y alcance cerrados: IA aplicada y analítica de datos, software a medida, ciberseguridad y equipos senior que se integran en tu empresa (staff augmentation). Sin junior facturados. España, Argentina y Estados Unidos.</p>
    <h2>Lo que hace Qerub</h2>
    <p>Qerub (marca de GroMely Invest, S.L.) es una consultora IT para pymes y medianas empresas de 50 a 300 empleados. Cubre cuatro frentes con un mismo equipo senior y precio cerrado:</p>

    <h3>IA y datos (Q-Intelligence)</h3>
    <p>Qerub lleva la IA del caso de uso a producción con ROI medible, ordena tus datos para BI self-service y gobierna el uso de IA bajo el EU AI Act. <a href="/servicios/consultoria-ia-datos-empresa">Ver el frente de IA y datos</a>.</p>
    <ul>
      <li><strong>Diagnóstico de IA-readiness:</strong> en 7 días, dónde están tus datos y qué decisión vale la pena automatizar.</li>
      <li><strong>IA generativa aplicada:</strong> agentes, asistentes y RAG sobre tu documentación, con trazabilidad.</li>
      <li><strong>Adopción de Copilot M365:</strong> despliegue por área con casos reales y formación.</li>
      <li><strong>Plataforma de datos y BI:</strong> datos ordenados y Power BI self-service; "AI-ready data".</li>
      <li><strong>Gobierno de IA (EU AI Act):</strong> inventario de usos, política, control del riesgo y "shadow AI".</li>
      <li><strong>Puesta en producción:</strong> despliegue, monitorización y transferencia a tu equipo.</li>
    </ul>

    <h3>Software a medida (Q-Build)</h3>
    <p>Qerub desarrolla aplicaciones, integraciones y modernización con criterio senior y seguridad desde el diseño; el código y los datos son tuyos. <a href="/servicios/desarrollo-software-medida-empresa">Ver el frente de software a medida</a>.</p>
    <ul>
      <li><strong>Desarrollo a medida:</strong> aplicaciones y herramientas internas que encajan con tu operación.</li>
      <li><strong>Integraciones:</strong> CRM, ERP, facturación, pagos y APIs conectados.</li>
      <li><strong>Modernización de aplicaciones:</strong> sacar el legacy del cuello de botella para poder usar IA.</li>
      <li><strong>MVP con criterio senior:</strong> de idea a producto usable; anti "vibe coding".</li>
      <li><strong>Cloud-native:</strong> desplegado en tu nube (Azure/AWS) con control de coste.</li>
      <li><strong>Seguridad desde el diseño:</strong> identidad, secretos y datos bien tratados.</li>
    </ul>

    <h3>Equipos senior integrados (Q-Pod)</h3>
    <p>Qerub integra perfiles senior en tu equipo en días, en tu huso horario, con operación gestionada (vCISO, vCIO/vCTO fraccional). Pagas resultado, no sillas. <a href="/servicios/staff-augmentation-nearshore">Ver el frente de equipos senior</a>.</p>
    <ul>
      <li><strong>Perfiles senior:</strong> IA, datos, cloud, backend y ciberseguridad; compartimos CV, años y stack antes de incorporar.</li>
      <li><strong>Integración en tu equipo:</strong> bajo tu backlog y tus herramientas, como uno más.</li>
      <li><strong>Nearshore en tres husos:</strong> España, Argentina (UTC-3) y EE.UU., con solape horario real.</li>
      <li><strong>vCISO y vCIO/vCTO fraccional:</strong> un veterano unas horas a la semana.</li>
      <li><strong>SLA de sustitución:</strong> si no encaja en dos semanas, lo cambiamos sin coste. 100% senior, sin junior.</li>
      <li><strong>Salida limpia:</strong> el conocimiento, el código y los datos son tuyos.</li>
    </ul>

    <h3>Ciberseguridad (Q-Secure)</h3>
    <p>El pilar más maduro de Qerub: nueve servicios con alcance y precio cerrados, alineados con NIST CSF 2.0, CIS Controls IG1 y NIS2.</p>
    <ul>
      <li><strong><a href="/servicios/auditoria-ciberseguridad-pymes">Q-Start · Diagnóstico de ciberseguridad</a>:</strong> scorecard ejecutivo, top 15 riesgos y roadmap de 90 días en 7 días hábiles.</li>
      <li><strong><a href="/servicios/seguridad-microsoft-365-empresa">Q-365 Shield · Seguridad Microsoft 365</a>:</strong> hardening de identidad y tenant (MFA, Conditional Access).</li>
      <li><strong><a href="/servicios/email-bec-spf-dkim-dmarc">Q-Mail Shield · Correo seguro y anti-fraude BEC</a>:</strong> SPF, DKIM, DMARC y playbook anti-fraude.</li>
      <li><strong><a href="/servicios/simulacion-phishing-empresa">Q-Phishing Drill · Simulación de phishing</a>:</strong> campañas continuas y microlearning.</li>
      <li><strong><a href="/servicios/plan-respuesta-incidentes-pyme">Q-Incident · Plan de respuesta a incidentes</a>:</strong> playbook, prueba de copias y simulacro de mesa.</li>
      <li><strong><a href="/servicios/vciso-pyme">Q-Continuity · vCISO y continuidad</a>:</strong> gobierno mensual y evidencias para NIS2.</li>
      <li><strong><a href="/servicios/vigilancia-dark-web-empresa">Q-Dark Watch · Vigilancia de dark web</a>:</strong> alerta con plan de acción ante filtraciones.</li>
      <li><strong><a href="/servicios/ciberseguro-pyme">Q-Insure · Preparación para el ciberseguro</a>:</strong> cuestionario de aseguradora y controles mínimos.</li>
      <li><strong><a href="/servicios/seguridad-ia-empresa">Q-AI Ready · Seguridad del uso de IA</a>:</strong> política de IA, Copilot seguro y formación.</li>
    </ul>

    <p><strong>Contacto:</strong> <a href="mailto:info@qerub.com">info@qerub.com</a> · +34 615 60 07 07</p>
    <h2>Preguntas frecuentes</h2>
    <dl>
      <dt><strong>¿Solo hacéis ciberseguridad, o también IA, datos y software?</strong></dt>
      <dd>Las cuatro cosas, con un mismo equipo senior y precio cerrado. La ciberseguridad (Q-Secure) es nuestro pilar más maduro; IA y datos (Q-Intelligence) y software a medida (Q-Build) se entregan con alcance acotado, precio cerrado y total transparencia.</dd>
      <dt><strong>¿Cómo funciona el modelo de equipos senior (Q-Pod)?</strong></dt>
      <dd>Te presentamos una terna senior en 5-10 días, con CV, años de experiencia y stack. La persona se integra en tu equipo y trabaja en tu huso horario. Pagas resultado, no sillas, y si en las dos primeras semanas no encaja, la cambiamos sin coste. Sin junior facturados.</dd>
      <dt><strong>¿Tenéis oficinas en tres países?</strong></dt>
      <dd>Operamos en tres husos horarios — España (cumplimiento europeo), Argentina (entrega senior nearshore) y Estados Unidos (frente comercial) — para estar cerca de tu negocio a la hora que lo necesitas. No te vendemos una gran firma que no somos: te decimos exactamente qué hay en cada sitio.</dd>
      <dt><strong>¿Cuánto cuesta el diagnóstico Q-Start?</strong></dt>
      <dd>Precio cerrado en función del tamaño de tu organización. Te enviamos una propuesta concreta en 24 horas tras la primera llamada. Sin sorpresas.</dd>
      <dt><strong>¿Necesitamos equipo técnico interno para trabajar con vosotros?</strong></dt>
      <dd>No. Q-Start está diseñado para que la dirección entienda y decida sin un CISO interno. Si tienes proveedor IT, coordinamos con él.</dd>
      <dt><strong>¿Y si ya hicimos una auditoría hace tiempo?</strong></dt>
      <dd>Mejor. Partimos de ahí, no de cero. Validamos qué se ejecutó, qué quedó abierto y dónde están hoy los riesgos vivos.</dd>
      <dt><strong>¿Trabajáis con NIS2?</strong></dt>
      <dd>Sí. Q-Continuity está pensado para generar evidencias trazables de gobierno, gestión de incidentes y continuidad — los pilares de NIS2.</dd>
      <dt><strong>¿Hacéis pentesting?</strong></dt>
      <dd>No como puerta de entrada. Lo introducimos cuando la postura base ya está sana. Antes de eso, un pentest solo confirma lo que ya sabemos.</dd>
      <dt><strong>¿Puedo contrataros solo para formación?</strong></dt>
      <dd>Sí. Q-Phishing Drill se contrata de forma independiente como cuota mensual.</dd>
    </dl>
