  <div style="max-width:680px;margin:80px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;color:#0e1416;line-height:1.6;">
    <h1>Qerub — IT consulting for growing companies</h1>
    <p>Your senior IT team, with fixed scope and price: applied AI and data analytics, custom software, cybersecurity and senior teams that embed in your company (staff augmentation). No junior staff billed. Spain, Argentina and the United States.</p>
    <h2>What Qerub does</h2>
    <p>Qerub (a brand of GroMely Invest, S.L.) is an IT consultancy for Spanish-speaking SMBs and mid-market companies of 50 to 300 employees. It covers four fronts with one senior team and a fixed price:</p>

    <h3>AI &amp; data (Q-Intelligence)</h3>
    <p>Qerub takes AI from use case to production with measurable ROI, organizes your data for self-service BI and governs AI use under the EU AI Act. <a href="/en-us/servicios/consultoria-ia-datos-empresa">See the AI and data front</a>.</p>
    <ul>
      <li><strong>AI-readiness assessment:</strong> in 7 days, where your data lives and which decision is worth automating.</li>
      <li><strong>Applied generative AI:</strong> agents, assistants and RAG over your documentation, with traceability.</li>
      <li><strong>M365 Copilot adoption:</strong> rollout per department with real use cases and training.</li>
      <li><strong>Data platform &amp; BI:</strong> clean data and self-service Power BI; "AI-ready data".</li>
      <li><strong>AI governance (EU AI Act):</strong> inventory of uses, policy, risk controls and "shadow AI".</li>
      <li><strong>Production rollout:</strong> deploy, monitor and hand over to your team.</li>
    </ul>

    <h3>Custom software (Q-Build)</h3>
    <p>Qerub builds applications, integrations and modernization with senior judgment and security by design; the code and data are yours. <a href="/en-us/servicios/desarrollo-software-medida-empresa">See the custom software front</a>.</p>
    <ul>
      <li><strong>Custom development:</strong> applications and internal tools that fit your real operation.</li>
      <li><strong>Integrations:</strong> CRM, ERP, billing, payments and APIs connected.</li>
      <li><strong>Application modernization:</strong> taking legacy out of the bottleneck so you can use AI.</li>
      <li><strong>MVP with senior judgment:</strong> from idea to a usable product; anti "vibe coding".</li>
      <li><strong>Cloud-native:</strong> deployed to your cloud (Azure/AWS) with cost control.</li>
      <li><strong>Security by design:</strong> identity, secrets and data handled properly.</li>
    </ul>

    <h3>Embedded senior teams (Q-Pod)</h3>
    <p>Qerub embeds senior profiles in your team in days, in your time zone, with managed operation (vCISO, fractional vCIO/vCTO). You pay for outcomes, not seats. <a href="/en-us/servicios/staff-augmentation-nearshore">See the senior teams front</a>.</p>
    <ul>
      <li><strong>Senior profiles:</strong> AI, data, cloud, backend and cybersecurity; we share CV, years and stack before anyone joins.</li>
      <li><strong>Embedded in your team:</strong> under your backlog and your tools, as one of yours.</li>
      <li><strong>Nearshore across three zones:</strong> Spain, Argentina (UTC-3) and the US, with real overlap.</li>
      <li><strong>vCISO &amp; fractional vCIO/vCTO:</strong> a veteran a few hours a week.</li>
      <li><strong>Replacement SLA:</strong> if it doesn't fit in two weeks, we replace it at no cost. 100% senior, no junior.</li>
      <li><strong>Clean exit:</strong> the knowledge, code and data are yours.</li>
    </ul>

    <h3>Cybersecurity (Q-Secure)</h3>
    <p>Qerub's most mature pillar: nine services with fixed scope and price, aligned with NIST CSF 2.0, CIS Controls IG1 and NIS2.</p>
    <ul>
      <li><strong><a href="/en-us/servicios/auditoria-ciberseguridad-pymes">Q-Start · Cybersecurity assessment</a>:</strong> executive scorecard, top 15 risks and a 90-day roadmap in 7 business days.</li>
      <li><strong><a href="/en-us/servicios/seguridad-microsoft-365-empresa">Q-365 Shield · Microsoft 365 security</a>:</strong> identity and tenant hardening (MFA, Conditional Access).</li>
      <li><strong><a href="/en-us/servicios/email-bec-spf-dkim-dmarc">Q-Mail Shield · Secure email &amp; BEC anti-fraud</a>:</strong> SPF, DKIM, DMARC and anti-fraud playbook.</li>
      <li><strong><a href="/en-us/servicios/simulacion-phishing-empresa">Q-Phishing Drill · Phishing simulation</a>:</strong> continuous campaigns and microlearning.</li>
      <li><strong><a href="/en-us/servicios/plan-respuesta-incidentes-pyme">Q-Incident · Incident response plan</a>:</strong> playbook, backup-restore test and tabletop drill.</li>
      <li><strong><a href="/en-us/servicios/vciso-pyme">Q-Continuity · vCISO &amp; continuity</a>:</strong> monthly governance and NIS2 evidence.</li>
      <li><strong><a href="/en-us/servicios/vigilancia-dark-web-empresa">Q-Dark Watch · Dark web monitoring</a>:</strong> alert with an action plan on breaches.</li>
      <li><strong><a href="/en-us/servicios/ciberseguro-pyme">Q-Insure · Cyber-insurance readiness</a>:</strong> insurer questionnaire and minimum controls.</li>
      <li><strong><a href="/en-us/servicios/seguridad-ia-empresa">Q-AI Ready · AI usage security</a>:</strong> AI policy, secure Copilot and training.</li>
    </ul>

    <p><strong>Contact:</strong> <a href="mailto:info@qerub.com">info@qerub.com</a> · +34 615 60 07 07</p>

    <h2>Frequently asked questions</h2>
    <dl>
      <dt><strong>Do you only do cybersecurity, or also AI, data and software?</strong></dt>
      <dd>All four, with the same senior team and a fixed price. Cybersecurity (Q-Secure) is our most mature pillar; AI and data (Q-Intelligence) and custom software (Q-Build) are delivered with tight scope, fixed price and full transparency.</dd>
      <dt><strong>How does the senior-team model (Q-Pod) work?</strong></dt>
      <dd>We send a senior shortlist in 5-10 days, with CV, years of experience and stack. The person embeds in your team and works in your time zone. You pay for outcomes, not seats, and if it does not fit in the first two weeks, we replace them at no cost. No junior staff billed.</dd>
      <dt><strong>Do you have offices in three countries?</strong></dt>
      <dd>We operate across three time zones — Spain (European compliance), Argentina (senior nearshore delivery) and the United States (commercial front) — to be close to your business when you need it. We will not sell you a big firm we are not: we tell you exactly what is in each place.</dd>
      <dt><strong>How much is the Q-Start assessment?</strong></dt>
      <dd>Closed price based on your org size. We send a concrete proposal within 24 hours after the first call. No surprises.</dd>
      <dt><strong>Do we need an internal tech team to work with you?</strong></dt>
      <dd>No. Q-Start is designed for management to understand and decide without an internal CISO. If you have an IT vendor, we coordinate with them.</dd>
      <dt><strong>What if we already did an audit a while ago?</strong></dt>
      <dd>Even better. We start from there, not from zero. We validate what was executed, what remained open and where the live risks are today.</dd>
      <dt><strong>Do you work with NIS2?</strong></dt>
      <dd>Yes. Q-Continuity is built to produce traceable governance evidence, incident management and continuity — the pillars of NIS2.</dd>
      <dt><strong>Do you do pentesting?</strong></dt>
      <dd>Not as an entry point. We introduce it once the base posture is healthy. Before that, a pentest only confirms what we already know.</dd>
      <dt><strong>Can I hire you only for training?</strong></dt>
      <dd>Yes. Q-Phishing Drill is contracted independently as a monthly fee.</dd>
    </dl>
